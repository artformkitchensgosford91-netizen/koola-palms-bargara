backend:
  name: github
  repo: artformkitchensgosford91-netizen/koola-palms-bargara
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: "https://koolapalmsbargara.au"
display_url: "https://koolapalmsbargara.au"
logo_url: "/assets/koola-logo.png"
publish_mode: simple

collections:
  - name: "website"
    label: "Koola Palms Website"
    files:
      - label: "Website content"
        name: "site"
        file: "content/site.json"
        format: "json"
        fields:
          - label: "Website optimisation"
            name: "seo"
            widget: "object"
            collapsed: false
            fields:
              - { label: "SEO page title", name: "title", widget: "string", hint: "Aim for roughly 50–60 characters." }
              - { label: "Google meta description", name: "description", widget: "text", hint: "Aim for roughly 140–160 characters." }
              - { label: "Canonical URL", name: "canonicalUrl", widget: "string" }
              - { label: "Social share title", name: "socialTitle", widget: "string" }
              - { label: "Social share description", name: "socialDescription", widget: "text" }
              - { label: "Social share image", name: "socialImage", widget: "image" }
              - { label: "Google Search Console verification code", name: "searchConsoleVerification", widget: "string", required: false, hint: "Paste only the content value from Google's verification meta tag." }
          - label: "Analytics & conversion tracking"
            name: "analytics"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Google Analytics 4 Measurement ID", name: "ga4MeasurementId", widget: "string", required: false, hint: "Example: G-XXXXXXXXXX. Leave blank until GA4 is created." }
          - label: "Property search data"
            name: "property"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Property name", name: "name", widget: "string" }
              - { label: "Street address", name: "streetAddress", widget: "string" }
              - { label: "Suburb / locality", name: "addressLocality", widget: "string" }
              - { label: "State", name: "addressRegion", widget: "string" }
              - { label: "Postcode", name: "postalCode", widget: "string" }
              - { label: "Country code", name: "addressCountry", widget: "string", default: "AU" }
              - { label: "Bedrooms", name: "bedrooms", widget: "number", value_type: "int", min: 1 }
              - { label: "Maximum guests", name: "guests", widget: "number", value_type: "int", min: 1 }
              - { label: "Latitude", name: "latitude", widget: "string", required: false }
              - { label: "Longitude", name: "longitude", widget: "string", required: false }
          - label: "Homepage hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Main heading", name: "headline", widget: "string" }
              - { label: "Accent heading", name: "headlineAccent", widget: "string" }
              - { label: "Intro text", name: "lead", widget: "text" }
              - { label: "Main hero image", name: "mainImage", widget: "image" }
              - { label: "Secondary hero image", name: "secondaryImage", widget: "image" }
          - label: "Booking links"
            name: "booking"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Direct booking URL", name: "directUrl", widget: "string" }
              - { label: "Booking.com URL", name: "bookingComUrl", widget: "string" }
          - label: "Contact details"
            name: "contact"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Phone as displayed", name: "phoneDisplay", widget: "string" }
              - { label: "Phone link digits", name: "phoneLink", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
          - label: "Apartment gallery"
            name: "propertyGallery"
            widget: "list"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Caption", name: "caption", widget: "text" }
              - { label: "Lightbox caption", name: "lightboxCaption", widget: "string" }
              - { label: "Alt text", name: "alt", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Large feature tile", name: "featured", widget: "boolean", default: false, required: false }
          - label: "Local area gallery"
            name: "localGallery"
            widget: "list"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Caption", name: "caption", widget: "text" }
              - { label: "Lightbox caption", name: "lightboxCaption", widget: "string" }
              - { label: "Alt text", name: "alt", widget: "text" }
              - { label: "Photo", name: "image", widget: "image" }
